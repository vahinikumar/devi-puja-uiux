<!DOCTYPE html>
<html lang="te">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>దేవి భక్తి & వేదపఠనం</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body class="home-page has-bottom-nav">

    <!-- Header Section (Screen1 South Indian Temple Arch Benchmark) -->
    <header class="home-temple-header" role="banner">
        <!-- Brass Temple Hamburger Button (Hit Area on Arch Door Fitting) -->
        <button class="hit menu" onclick="toggleDrawer(true)" aria-label="మెనూ"></button>
        
        <!-- Temple Title & Subtitle sitting directly in the carved plaque -->
        <h1 class="t">దేవి భక్తి & వేదపఠనం</h1>
        <div class="sub t">భక్తి • జ్ఞానం • శాంతి</div>

        <!-- Hidden PWA install button preserved -->
        <button id="installBtn" style="display:none;">📲 యాప్ ఇన్‌స్టాల్ చేయండి</button>
    </header>

    <!-- Side Drawer (In-page only) -->
    <div id="drawerBackdrop" class="drawer-backdrop" onclick="toggleDrawer(false)"></div>
    <aside id="sideDrawer" class="side-drawer" aria-label="సైడ్ మెనూ">
        <div class="drawer-header">
            <span class="drawer-title">॥ శ్రీరస్తు ॥</span>
            <button class="drawer-close-btn" onclick="toggleDrawer(false)" aria-label="మూసివేయి">✕</button>
        </div>
        <ul class="drawer-menu-list">
            <li>
                <button class="drawer-menu-item" onclick="toggleDrawer(false); window.location.href='index.html'">
                    <span>🏠</span> హోమ్
                </button>
            </li>
            <li>
                <button class="drawer-menu-item" onclick="toggleDrawer(false); window.location.href='devi/index.html'">
                    <span>🌺</span> దేవి భక్తి
                </button>
            </li>
            <li>
                <button class="drawer-menu-item" data-evening-only onclick="toggleDrawer(false); window.location.href='veda/vedapatnam.html'">
                    <span>🪔</span> వేదపఠనం
                </button>
            </li>
        </ul>
    </aside>

    <!-- Main Navigation Container -->
    <main class="container">
        
        <!-- Card 1: 🌺 దేవి భక్తి (Vertical Mobile Card) -->
        <section class="gateway-card" onclick="window.open('devi/index.html','_blank')" role="button" tabindex="0">
            <div class="gateway-img-wrap">
                <img src="assets/devi.jpeg" alt="దేవి భక్తి" class="gateway-img">
            </div>
            <div class="gateway-info">
                <h2 class="gateway-title">🌺 దేవి భక్తి</h2>
                <ul class="gateway-bullet-list">
                    <li>• దశ మహావిద్యా ఆరాధన</li>
                    <li>• స్తోత్ర పాఠాలు</li>
                    <li>• పూజా విధులు</li>
                </ul>
                <div class="gateway-cta-wrap">
                    <span class="gateway-pill-btn">ప్రవేశించండి ›</span>
                </div>
            </div>
        </section>

        <!-- Card 2: 🪔 వేదపఠనం (Vertical Mobile Card) -->
        <section class="gateway-card" data-evening-only onclick="window.open('veda/vedapatnam.html','_blank')" role="button" tabindex="0">
            <div class="gateway-img-wrap">
                <img src="assets/vedapatnam.png" alt="వేదపఠనం" class="gateway-img">
            </div>
            <div class="gateway-info">
                <h2 class="gateway-title">🪔 వేదపఠనం</h2>
                <ul class="gateway-bullet-list">
                    <li>• సూక్తులు • వేద మంత్రాలు</li>
                    <li>• పారాయణం • అర్థం</li>
                </ul>
                <div class="gateway-cta-wrap">
                    <span class="gateway-pill-btn">ప్రవేశించండి ›</span>
                </div>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation Bar (Slide 01 Reference: 2 Items Only) -->
    <nav class="app-bottom-nav" aria-label="ముఖ్య నావిగేషన్">
        <button class="bottom-nav-item active" onclick="window.location.href='index.html'" aria-label="హోమ్">
            <span class="bottom-nav-icon">🏠</span>
            <span class="bottom-nav-label">హోమ్</span>
        </button>
        <button class="bottom-nav-item" data-evening-only onclick="window.location.href='veda/vedapatnam.html'" aria-label="వేదపఠనం">
            <span class="bottom-nav-icon">🪔</span>
            <span class="bottom-nav-label">వేదపఠనం</span>
        </button>
    </nav>

    <script>
        function toggleDrawer(open) {
            const drawer = document.getElementById('sideDrawer');
            const backdrop = document.getElementById('drawerBackdrop');
            if (drawer && backdrop) {
                if (open) {
                    drawer.classList.add('open');
                    backdrop.classList.add('open');
                } else {
                    drawer.classList.remove('open');
                    backdrop.classList.remove('open');
                }
            }
        }
    </script>

</body>
</html>
