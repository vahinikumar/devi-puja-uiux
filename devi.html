<script>
/* Dynamic data: call setDeity({name, image}) or open the page with ?name=...&image=https://... */
var nameEl=document.getElementById('name'),img=document.getElementById('img'),ph=document.getElementById('ph');
function setDeity(d){
  if(d&&d.name){nameEl.textContent=d.name;document.title=d.name;}
  if(d&&d.image){
    img.onload=function(){img.hidden=false;ph.hidden=true;};
    img.onerror=function(){img.hidden=true;ph.hidden=false;};
    img.alt=(d.name||'');img.src=d.image;
  }else{img.hidden=true;ph.hidden=false;}
}
window.setDeity=setDeity;
var q=new URLSearchParams(location.search);
setDeity({name:q.get('name'),image:q.get('image')});
</script>
